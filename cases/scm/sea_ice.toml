# Single column over sea ice at 80°N, perpetual equinox (sun near the horizon), cold air
# (SPEC.md P2 acceptance 1: sea-ice energy and water conservation including the latent heat
# of fusion). Zero-layer ice 1 m thick under 30 kg m⁻² of snow on a 50 m mixed layer at the
# freezing point; moist air near saturation so that it snows.
schema = 2
description = "SCM: sea ice and snow at 80°N, equinox, moist"
model = "scm"
truncation = 21
levels = "L26"
length = "10day"
output_every = "30min"

[scm]
lat = 80.0
lon = 0.0
dt = "30min"
t_air = 255.0
lapse_rate = 6.5
t_tropopause = 210.0
wind = [8.0, 0.0]
wind_mode = "geostrophic"
rh = 0.95

[scm.surface]
kind = "ocean"
mixed_layer_depth = 50.0
t_initial = 250.0
ice_thickness = 1.0
ice_snow = 30.0

[star]
t_eff = 5772.0
luminosity = 1.0
mass = 1.0

[orbit]
semi_major_axis = 1.0
eccentricity = 0.0
obliquity = 0.0
spin = "free"
diurnal = true

[planet]
preset = "earth"

[atmosphere]
surface_pressure = 100000.0
composition = { N2 = 0.7808, O2 = 0.2095, Ar = 0.0093, CO2 = 0.0004 }
gas_constant = 287.04
cp = 1004.64

[radiation]
scheme = "gray"

[boundary_layer]
scheme = "kprofile"

[convection]
scheme = "sbm"

[moisture]
condensable = "water"
