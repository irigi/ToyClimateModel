# Stiff surface (SPEC.md P1 acceptance 2): land with heat capacity 1e3 J m⁻² K⁻¹ under a
# fixed 30 m/s wind, physics step 1 h. The coupled implicit solve must not produce a 2Δt
# oscillation of T_s. Gray radiation, K-profile boundary layer, dry adjustment, dry air.
schema = 2
description = "SCM: stiff land surface, 30 m/s wind, 1 h step"
model = "scm"
truncation = 21
levels = "L26"
length = "10day"
output_every = "1h"

[scm]
lat = 20.0
lon = 0.0
dt = "1h"
t_air = 300.0
lapse_rate = 6.5
t_tropopause = 200.0
wind = [30.0, 0.0]
wind_mode = "fixed"

[scm.surface]
kind = "land"
heat_capacity = 1.0e3
albedo = 0.3
beta = 0.0
t_initial = 300.0

[star]
t_eff = 5772.0
luminosity = 1.0
mass = 1.0

[orbit]
semi_major_axis = 1.0
eccentricity = 0.0
obliquity = 0.0
spin = "free"
diurnal = true

[planet]
preset = "earth"

[atmosphere]
surface_pressure = 100000.0
composition = { N2 = 0.7808, O2 = 0.2095, Ar = 0.0093, CO2 = 0.0004 }
gas_constant = 287.04
cp = 1004.64

[radiation]
scheme = "gray"
# Earth-shaped optical depth τ₀(φ) (Frierson et al. 2006), on only in Earth-like idealized cases (P3)
latitude_dependence = true

[boundary_layer]
scheme = "kprofile"

[convection]
scheme = "dry"
