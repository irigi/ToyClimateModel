# Single column over snow-covered land at 55°N, perpetual equinox, clear sky (SPEC.md P2
# acceptance 1: snowpack energy and water conservation; a snow-covered tile stays at or
# below the freezing point while snow remains). Moist air near freezing; 5-layer soil,
# 40 kg m⁻² of snow; the noon sun melts it. Gray radiation (prototype), K-profile boundary
# layer, SBM convection, large-scale condensation with the ice phase and fall.
schema = 2
description = "SCM: snowmelt on land at 55°N, equinox, moist"
model = "scm"
truncation = 21
levels = "L26"
length = "10day"
output_every = "30min"

[scm]
lat = 55.0
lon = 0.0
dt = "30min"
t_air = 278.0
lapse_rate = 6.5
t_tropopause = 210.0
wind = [6.0, 0.0]
wind_mode = "geostrophic"
rh = 0.8

[scm.surface]
kind = "land"
beta = 0.5
t_initial = 272.0
snow = 40.0

[star]
t_eff = 5772.0
luminosity = 1.0
mass = 1.0

[orbit]
semi_major_axis = 1.0
eccentricity = 0.0
obliquity = 0.0
spin = "free"
diurnal = true

[planet]
preset = "earth"

[atmosphere]
surface_pressure = 100000.0
composition = { N2 = 0.7808, O2 = 0.2095, Ar = 0.0093, CO2 = 0.0004 }
gas_constant = 287.04
cp = 1004.64

[radiation]
scheme = "gray"
# Earth-shaped optical depth τ₀(φ) (Frierson et al. 2006), on only in Earth-like idealized cases (P3)
latitude_dependence = true

[boundary_layer]
scheme = "kprofile"

[convection]
scheme = "sbm"

[moisture]
condensable = "water"
