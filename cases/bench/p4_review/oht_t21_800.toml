# DIAGNOSTIC ONLY, not a case to accept (P4 question 13, review round of 2026-11-23, item 4): the frozen-knob
# slab pair with the prescribed ocean heat transport of setup `ocean_slab::set_qflux` (Merlis et al. 2013 form,
# phi0 = 16 deg, Q0 = 50 W m-2, the "typical Earth-like value" of config/blocks.rs), 30 years from the
# year-55 restart of out/p4/gate/slab2_t21_800; climatology and the equilibrium test over the last 10 years.
# Shows how much of the 2xCO2 warming belongs to the no-heat-transport configuration. Whether criterion 4 may
# use such a configuration is the owner's decision.
# Run: toyclim run --config <this> --out out/p4/review/oht_800 --restart out/p4/gate/slab2_t21_800/restart
schema = 2
description = "Review round 2026-11-23, item 4 (diagnostic): frozen-knob slab pair with ocean heat transport Q0 = 50 W m-2, years 56-85, 800 ppm"
model = "primitive"
truncation = 21
levels = "L26"
dt = "20min"
length = "31046.25day"
output_every = "365.25day"
diagnostics_every = "1day"
output_fields = ["ts", "tos", "sic", "sit", "snw", "precip", "tas"]
initial_condition = { case = "jw06", perturbed = true }
[star]
t_eff = 5772.0
luminosity = 1.0
mass = 1.0

# year: the original 365.25 days (derived: 365.256 d), kept so that results are
# unchanged; checked against the derived value (< 1%).
[orbit]
semi_major_axis = 1.0
eccentricity = 0.0167
obliquity = 23.44
perihelion_longitude = 282.9
spin = "free"
diurnal = true
year = "365.25day"
instellation = 1361.0

# Earth preset: rotation rate 7.292e-5 s⁻¹ (Williamson et al. 1992).
[planet]
preset = "earth"

# R_d and c_p: the Williamson et al. (1992) values used by the dynamical core, checked
# against the mixture (287.04 / 1005.0 J kg⁻¹ K⁻¹).
[atmosphere]
surface_pressure = 100000.0
composition = { N2 = 0.7808, O2 = 0.2095, Ar = 0.0093, CO2 = 0.0008 }
gas_constant = 287.04
cp = 1004.64

[moisture]
condensable = "water"
initial = "tj16"

[radiation]
scheme = "semigray"
# Earth ozone column of the calibration (docs/radiation/calibration.md)
ozone_tau = 0.02425
ozone_p = 6429.6

# Bulk surface fluxes (Louis 1979 stability, Charnock roughness) and the K-profile
# boundary layer of Frierson et al. (2006), solved implicitly with the surface energy
# balance (SPEC.md §9.4.2–9.4.3); no Rayleigh drag. Energy fixer for the hyperdiffusion.
[clouds]
scheme = "diagnostic"

[boundary_layer]
scheme = "kprofile"

[dynamics]
# grid-point semi-Lagrangian humidity transport: the §9.8 tracer-fixer trigger fired in P1
# (spectral transport: fixer 2.3%/day of the vapour mass at T42, APE Control)
tracer_transport = "semi_lagrangian"
energy_fixer = true

[convection]
scheme = "sbm"

[surface]
geography = "aquaplanet"

[surface.ocean]
model = "slab"
albedo = 0.06
mixed_layer_depth = 20.0
heat_transport = 50.0
initial = "tj16"

# Zero-layer sea-ice thermodynamics with band albedos (P2).
[surface.sea_ice]
enabled = true

[diffusion]
order = 4
tau = "2.4h"

[climatology]
start = "27393.75day"
every = "1day"
maps = ["ts", "tos", "sic", "sit", "tas", "precip", "clt", "clwvi", "olr", "olr_cs", "asr", "asr_cs", "rsdt"]
