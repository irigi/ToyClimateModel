# DIAGNOSTIC ONLY (P4 question 13, owner decision of 2026-11-23, next step 1): separating run. SST = the
# monthly 400 ppm slab SST (out/p4/review/bc/slab400_tos.npy) + a uniform 12.2038 K, the area-weighted
# 20S-20N annual mean of the 800 - 400 slab SST difference; sea-ice concentration and floe thickness of the
# 400 ppm state (unchanged, so SST under and next to the ice is warmer than freezing); CO2 400 ppm. Compared
# with fx_s800_c400 (800 ppm SST pattern, same tropical mean) it separates the SST pattern from the warmer
# base state. Record only.
# Run: toyclim run --config <this> --out out/p4/review/fx_s400p12_c400
schema = 2
description = "Review round 2026-11-23, owner step 1: separating run, 400 ppm slab SST + uniform 12.20 K (20S-20N mean 800-400 difference) with 400 ppm sea ice and CO2, T21, 1 + 2 years"
model = "primitive"
truncation = 21
levels = "L26"
dt = "20min"
length = "1095.75day"
output_every = "5day"
diagnostics_every = "1day"
output_fields = ["ts", "cl", "cl_split"]
initial_condition = { case = "jw06", perturbed = true }
[star]
t_eff = 5772.0
luminosity = 1.0
mass = 1.0

# year: the original 365.25 days (derived: 365.256 d), kept so that results are
# unchanged; checked against the derived value (< 1%).
[orbit]
semi_major_axis = 1.0
eccentricity = 0.0167
obliquity = 23.44
perihelion_longitude = 282.9
spin = "free"
diurnal = true
year = "365.25day"
instellation = 1361.0

# Earth preset: rotation rate 7.292e-5 s⁻¹ (Williamson et al. 1992).
[planet]
preset = "earth"

# R_d and c_p: the Williamson et al. (1992) values used by the dynamical core, checked
# against the mixture (287.04 / 1005.0 J kg⁻¹ K⁻¹).
[atmosphere]
surface_pressure = 100000.0
composition = { N2 = 0.7808, O2 = 0.2095, Ar = 0.0093, CO2 = 0.0004 }
gas_constant = 287.04
cp = 1004.64

[moisture]
condensable = "water"
initial = "tj16"

[radiation]
scheme = "semigray"
# Earth ozone column of the calibration (docs/radiation/calibration.md)
ozone_tau = 0.02425
ozone_p = 6429.6

# Bulk surface fluxes (Louis 1979 stability, Charnock roughness) and the K-profile
# boundary layer of Frierson et al. (2006), solved implicitly with the surface energy
# balance (SPEC.md §9.4.2–9.4.3); no Rayleigh drag. Energy fixer for the hyperdiffusion.
[clouds]
scheme = "diagnostic"
cre_split = true

[boundary_layer]
scheme = "kprofile"

[dynamics]
# grid-point semi-Lagrangian humidity transport: the §9.8 tracer-fixer trigger fired in P1
# (spectral transport: fixer 2.3%/day of the vapour mass at T42, APE Control)
tracer_transport = "semi_lagrangian"
energy_fixer = true

[convection]
scheme = "sbm"

[surface]
geography = "aquaplanet"

[surface.ocean]
model = "prescribed"
sst = "out/p4/review/bc/slab400p12_tos.npy"
sea_ice = "out/p4/review/bc/slab400_sic.npy"
# mean sic-weighted slab ice thickness per hemisphere (tools/slab_bc.py), north / south
ice_thickness = [3.23, 2.20]
albedo = 0.06
initial = "tj16"

[diffusion]
order = 4
tau = "2.4h"

[climatology]
start = "365.25day"
every = "1h"
maps = ["ts", "tos", "sic", "olr", "asr", "olr_cs", "asr_cs", "olr_nc", "asr_nc", "clt", "clwvi", "cc_conv", "cwp_conv", "precip", "precip_conv", "precip_ls", "conv_active", "conv_skipped", "cape", "rsdt"]
