# DIAGNOSTIC ONLY (P4 question 13, review round of 2026-11-23, item 2): the frozen-knob slab pair continued
# for 2 years (years 46-47) from the year-45 restart of out/p4/gate/slab_t21_400, unchanged physics
# except the diagnostic `cre_split` (extra radiation call, no feedback on the run). Gives (a) the monthly SST,
# sea-ice concentration and thickness climatology that the fixed-SST factorial prescribes, and (b) the slab
# reference values of the factorial's diagnostics (tropical CRE split, cover, convection statistics).
# Run: toyclim run --config <this> --out out/p4/review/slabref_400 --restart out/p4/gate/slab_t21_400/restart
schema = 2
description = "Review round 2026-11-23, item 2: frozen-knob slab pair, years 46-47 from the year-45 restart, monthly SST/ice and CRE split, 400 ppm"
model = "primitive"
truncation = 21
levels = "L26"
dt = "20min"
length = "17166.75day"
output_every = "5day"
diagnostics_every = "1day"
output_fields = ["ts", "cl", "cl_split"]
initial_condition = { case = "jw06", perturbed = true }
[star]
t_eff = 5772.0
luminosity = 1.0
mass = 1.0

# year: the original 365.25 days (derived: 365.256 d), kept so that results are
# unchanged; checked against the derived value (< 1%).
[orbit]
semi_major_axis = 1.0
eccentricity = 0.0167
obliquity = 23.44
perihelion_longitude = 282.9
spin = "free"
diurnal = true
year = "365.25day"
instellation = 1361.0

# Earth preset: rotation rate 7.292e-5 s⁻¹ (Williamson et al. 1992).
[planet]
preset = "earth"

# R_d and c_p: the Williamson et al. (1992) values used by the dynamical core, checked
# against the mixture (287.04 / 1005.0 J kg⁻¹ K⁻¹).
[atmosphere]
surface_pressure = 100000.0
composition = { N2 = 0.7808, O2 = 0.2095, Ar = 0.0093, CO2 = 0.0004 }
gas_constant = 287.04
cp = 1004.64

[moisture]
condensable = "water"
initial = "tj16"

[radiation]
scheme = "semigray"
# Earth ozone column of the calibration (docs/radiation/calibration.md)
ozone_tau = 0.02425
ozone_p = 6429.6

# Bulk surface fluxes (Louis 1979 stability, Charnock roughness) and the K-profile
# boundary layer of Frierson et al. (2006), solved implicitly with the surface energy
# balance (SPEC.md §9.4.2–9.4.3); no Rayleigh drag. Energy fixer for the hyperdiffusion.
[clouds]
scheme = "diagnostic"
cre_split = true

[boundary_layer]
scheme = "kprofile"

[dynamics]
# grid-point semi-Lagrangian humidity transport: the §9.8 tracer-fixer trigger fired in P1
# (spectral transport: fixer 2.3%/day of the vapour mass at T42, APE Control)
tracer_transport = "semi_lagrangian"
energy_fixer = true

[convection]
scheme = "sbm"

[surface]
geography = "aquaplanet"

[surface.ocean]
model = "slab"
albedo = 0.06
mixed_layer_depth = 20.0
initial = "tj16"

# Zero-layer sea-ice thermodynamics with band albedos (P2).
[surface.sea_ice]
enabled = true

[diffusion]
order = 4
tau = "2.4h"

[climatology]
start = "16436.25day"
every = "1h"
monthly = true
maps = ["ts", "tos", "sic", "olr", "asr", "olr_cs", "asr_cs", "olr_nc", "asr_nc", "clt", "clwvi", "cc_conv", "cwp_conv", "precip", "precip_conv", "precip_ls", "conv_active", "conv_skipped", "cape", "rsdt", "sit"]
