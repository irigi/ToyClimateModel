# DIAGNOSTIC ONLY (P4, not a gate, not a tuning target): Cess-type fixed-SST pair, APE Control SST + 10 K
# +10 K (P4 question 13 (b), step 4.1): screens whether the fixed-SST pair reproduces the slab tropical cloud loss
# when the tropics reach the slab 800 ppm temperatures (about 307-310 K); partner run: ape_t21_p0k.
# uniform (maps from tools/make_ape_sst.py), no sea ice, frozen P4 physics, T21. Gives the cloud and clear-sky
# responses per K by latitude without ice or slab equilibration. Below: the APE retest case it is derived from.
# Aqua-Planet Experiment "Control" with fixed SST (SPEC.md §9.6 P1 acceptance 5).
# P4 completion plan step 6, open question 6: the P3 retest (out/p3/ape_control_t42_semigray.toml)
# with the frozen P4 diagnostic clouds instead of the top reflectance 0.165.
#
# Neale & Hoskins (2000), "A standard test for AGCMs including their physical
# parametrizations I: the proposal", Atmos. Sci. Lett. 1, 101–107; APE design and SST
# specification (www.met.reading.ac.uk/~mike/APE/design.html, ape_spec_sst_2.pdf, fetched
# 2026-11-16), transcribed:
#   - SST "Control": T_s = 27 (1 − sin²(3φ/2)) °C for −π/3 < φ < π/3, 0 °C otherwise;
#   - no sea ice (minimum SST 0 °C), no orography;
#   - solar constant 1365 W m⁻²; perpetual equinox, symmetric about the equator, with a
#     diurnal cycle; eccentricity and obliquity zero;
#   - CO₂ 348 ppmv and an AMIP II ozone climatology (not represented: gray radiation);
#   - 3.5 years, the first 0.5 omitted (this gate: 1 + 3 years, SPEC.md P1).
# Physics: gray radiation as in Frierson, Held & Zurita-Gotor (2006, Sect. 2b and Table 1:
# τ_e = 6, τ_p = 1.5, f_l = 0.1; "No solar radiation is absorbed by the atmosphere", so
# tau_sw = 0 — the prototype's slant-path absorption τ_sw = 0.22 σ²/μ₀ heats the polar upper
# troposphere by several K/day at low sun, where the gray longwave cannot cool it; see
# docs/progress.md, P1),
# K-profile boundary layer with Louis surface exchange, dry adjustment, SBM convection,
# large-scale condensation, hyperdiffusion energy fixer. T42 L26, Δt = 15 min.
schema = 2
description = "P4 diagnostic: fixed-SST feedback pair, APE Control + 10 K, T21 L26, frozen P4 clouds, 1 + 2 years"
model = "primitive"
truncation = 21
dt = "20min"
levels = "L26"
length = "1095day"
output_every = "30day"
output_fields = ["t", "q", "rh", "ps", "ts", "clt", "precip"]
initial_condition = { case = "jw06", perturbed = true }

[star]
t_eff = 5772.0
luminosity = 1.0
mass = 1.0

# APE: S0 = 1365 W m⁻² (derived from L = 1 L☉ at 1 AU: 1361; within 1%).
[orbit]
semi_major_axis = 1.0
eccentricity = 0.0
obliquity = 0.0
spin = "free"
diurnal = true
instellation = 1365.0

[planet]
preset = "earth"

[atmosphere]
surface_pressure = 100000.0
composition = { N2 = 0.7808, O2 = 0.2095, Ar = 0.0093, CO2 = 0.000348 }
gas_constant = 287.04
cp = 1004.64

[moisture]
condensable = "water"
initial = "tj16"

[radiation]
# Question 6 retest after P4: semigray with the Earth ozone column and the frozen P4 clouds.
scheme = "semigray"
ozone_tau = 0.02425
ozone_p = 6429.6

[clouds]
scheme = "diagnostic"

[boundary_layer]
scheme = "kprofile"

[convection]
scheme = "sbm"

[dynamics]
# grid-point semi-Lagrangian humidity transport: the §9.8 tracer-fixer trigger fired in P1
# (spectral transport: fixer 2.3%/day of the vapour mass at T42, APE Control)
tracer_transport = "semi_lagrangian"
energy_fixer = true

[surface]
geography = "aquaplanet"

# Prescribed SST: APE Control. Ocean albedo 0.06 (SPEC.md §9.4.6 starting value; with a
# fixed SST it only sets the flux into the ocean).
[surface.ocean]
model = "prescribed"
sst = "reference/derived/t21/ape_control_p10k_tos.npy"
sea_ice = "reference/derived/t21/ape_sic_zero.npy"
initial = "tj16"
albedo = 0.06

[surface.sea_ice]
enabled = false

[diffusion]
order = 4
tau = "2.4h"

# Analysis window: years 2–4.
[climatology]
start = "365day"
every = "6h"
maps = ["precip", "precip_conv", "precip_ls", "evap", "pw", "ts", "tas", "olr", "asr", "shf", "lhf", "u_low", "sfcwind", "psl", "pblh", "clt", "olr_cs", "asr_cs", "rsdt"]
