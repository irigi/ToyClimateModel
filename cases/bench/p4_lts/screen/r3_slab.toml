# P4 Q13 screen (owner decision after step 7, 2026-11-24, step B): T21 slab aquaplanet 400 ppm, candidate r3_wm15u80
# (low_cloud = "slingo_lts", low_rh = "sundqvist", published LTS constants, water_max = 0.00015, rh_crit_upper = 0.8; otherwise the 2026-11-21 frozen knobs).
# 15 years (46-60) from the year-45 restart of the frozen-knob gate run, as the r6 gate run over the same years;
# climatology over the last 5 years (56-60). Screen: sea ice kept, T_s in 283-293 K, no trend toward melting in years 56-60.
# Run: toyclim run --config <this> --out out/p4/lts/screen/r3_slab --restart out/p4/gate/slab_t21_400/restart
schema = 2
description = "P4 Q13 screen: T21 slab aquaplanet 400 ppm, slingo_lts, candidate r3_wm15u80, years 46-60"
model = "primitive"
truncation = 21
levels = "L26"
dt = "20min"
length = "21915.0day"
output_every = "365.25day"
diagnostics_every = "1day"
output_fields = ["ts", "tos", "sic", "sit", "snw", "precip", "tas"]
initial_condition = { case = "jw06", perturbed = true }
[star]
t_eff = 5772.0
luminosity = 1.0
mass = 1.0

# year: the original 365.25 days (derived: 365.256 d), kept so that results are
# unchanged; checked against the derived value (< 1%).
[orbit]
semi_major_axis = 1.0
eccentricity = 0.0167
obliquity = 23.44
perihelion_longitude = 282.9
spin = "free"
diurnal = true
year = "365.25day"
instellation = 1361.0

# Earth preset: rotation rate 7.292e-5 s⁻¹ (Williamson et al. 1992).
[planet]
preset = "earth"

# R_d and c_p: the Williamson et al. (1992) values used by the dynamical core, checked
# against the mixture (287.04 / 1005.0 J kg⁻¹ K⁻¹).
[atmosphere]
surface_pressure = 100000.0
composition = { N2 = 0.7808, O2 = 0.2095, Ar = 0.0093, CO2 = 0.0004 }
gas_constant = 287.04
cp = 1004.64

[moisture]
condensable = "water"
initial = "tj16"

[radiation]
scheme = "semigray"
# Earth ozone column of the calibration (docs/radiation/calibration.md)
ozone_tau = 0.02425
ozone_p = 6429.6

# Bulk surface fluxes (Louis 1979 stability, Charnock roughness) and the K-profile
# boundary layer of Frierson et al. (2006), solved implicitly with the surface energy
# balance (SPEC.md §9.4.2–9.4.3); no Rayleigh drag. Energy fixer for the hyperdiffusion.
[clouds]
scheme = "diagnostic"
low_cloud = "slingo_lts"
low_rh = "sundqvist"
water_max = 0.00015
rh_crit_upper = 0.8

[boundary_layer]
scheme = "kprofile"

[dynamics]
# grid-point semi-Lagrangian humidity transport: the §9.8 tracer-fixer trigger fired in P1
# (spectral transport: fixer 2.3%/day of the vapour mass at T42, APE Control)
tracer_transport = "semi_lagrangian"
energy_fixer = true

[convection]
scheme = "sbm"

[surface]
geography = "aquaplanet"

[surface.ocean]
model = "slab"
albedo = 0.06
mixed_layer_depth = 20.0
initial = "tj16"

# Zero-layer sea-ice thermodynamics with band albedos (P2).
[surface.sea_ice]
enabled = true

[diffusion]
order = 4
tau = "2.4h"

[climatology]
start = "20088.75day"
every = "1day"
maps = ["ts", "tos", "sic", "sit", "tas", "precip", "clt", "clwvi", "olr", "olr_cs", "asr", "asr_cs", "rsdt"]
