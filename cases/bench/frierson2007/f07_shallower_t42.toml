# Diagnostic (P4 question 13, step 5): check of the SBM shallow-convection variants against Frierson (2007,
# J. Atmos. Sci. 64, 1959–1976, §3a–b, Table 1), read from the author's copy (atmos.uw.edu/~dargan/papers/f07b.pdf).
# The paper's setup, transcribed: Frierson, Held & Zurita-Gotor (2006) gray model, T42, 25 levels; slab mixed layer
# of heat capacity 1e7 J K⁻¹ m⁻² (2.4 m of water), no ocean heat transport, no sea ice; no seasonal or diurnal cycle;
# surface albedo 0.38; SW optical depth τ_S = 0.2 (p/p0)^4 (18 % absorbed); 1800 days, the last 1440 averaged;
# τ_SBM 2 h, RH_SBM 0.7. Table 1 (equatorial precipitation W m⁻², maximum overturning streamfunction 10⁹ kg s⁻¹):
#   shallower 291 / 184, qref 285 / 183, no shallow 386 / 250.
# Differences here: L26; the gray scheme of the APE gate (Frierson et al. 2006 τ, tau_sw = 0 instead of the
# paper's p⁴ SW absorption, which this scheme does not offer); 548 days, the last 365 averaged. The comparison is
# the ratio shallow / no shallow, not the absolute values.
schema = 2
description = "Frierson (2007) gray slab aquaplanet T42, shallow convection shallower (P4 question 13)"
model = "primitive"
truncation = 42
levels = "L26"
dt = "15min"
length = "548day"
output_every = "30day"
output_fields = ["ts", "precip"]
initial_condition = { case = "jw06", perturbed = true }

[star]
t_eff = 5772.0
luminosity = 1.0
mass = 1.0

[orbit]
semi_major_axis = 1.0
eccentricity = 0.0
obliquity = 0.0
perihelion_longitude = 0.0
spin = "free"
diurnal = false
year = "365.25day"
instellation = 1361.0

[planet]
preset = "earth"

[atmosphere]
surface_pressure = 100000.0
composition = { N2 = 0.7808, O2 = 0.2095, Ar = 0.0093, CO2 = 0.0004 }
gas_constant = 287.04
cp = 1004.64

[moisture]
condensable = "water"
initial = "tj16"

[radiation]
scheme = "gray"
latitude_dependence = true
tau_sw = 0.0

[boundary_layer]
scheme = "kprofile"

[dynamics]
tracer_transport = "semi_lagrangian"
energy_fixer = true

[convection]
scheme = "sbm"
shallow = "shallower"

[surface]
geography = "aquaplanet"

[surface.ocean]
model = "slab"
albedo = 0.38
mixed_layer_depth = 2.4
initial = "tj16"

[surface.sea_ice]
enabled = false

[diffusion]
order = 4
tau = "2.4h"

[climatology]
start = "183day"
every = "1h"
maps = ["precip", "precip_conv", "precip_ls", "ts", "olr", "asr", "cape", "conv_active", "conv_skipped", "conv_shallow"]
