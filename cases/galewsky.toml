# Galewsky, Scott & Polvani (2004), Tellus A 56, 429–440: barotropically unstable jet.
# u_max = 80 m/s, φ0 = π/7, φ1 = π/2 − φ0, mean depth 10 km (balanced h by quadrature),
# perturbation ĥ = 120 m, α = 1/3, β = 1/15, φ2 = π/4.
# The paper uses ∇² diffusion ν = 1e5 m² s⁻¹; we use the model's ∇⁸ hyperdiffusion.
# Constants from SPEC.md (standard values); the paper's host was unreachable on 2026-11-04.
description = "Galewsky 2004 barotropic instability (perturbed)"
model = "shallow_water"
truncation = 85
dt = "8min"
length = "6day"
output_every = "1day"
output_fields = ["h", "vor", "u", "v"]
initial_condition = { case = "galewsky", perturbed = true }

[planet]
preset = "earth"

[diffusion]
order = 4
tau = "2.4h"
