# Tidally locked moist aquaplanet with gray radiation (exoplanet example).
# Loosely TRAPPIST-1e-like: radius 0.92 R_E, g = 9.12 m/s², synchronous rotation, circular
# orbit with a 6.1-day period, instellation 900 W/m², no obliquity; the substellar point is
# fixed at 180°E. Not a THAI protocol reproduction (that is P7).
# Star: TRAPPIST-1 after Agol et al. (2021), Planet. Sci. J. 2, 1, Table 7 (M = 0.0898 M_sun,
# T_eff = 2566 K) with L = 5.66e-4 L_sun instead of the measured 5.53e-4 and a = 0.029254 AU
# instead of 0.02925, so that S = 900 W/m² and P = 6.1 d as in the original case.
# Radiation: gray two-stream LW (Frierson, Held & Zurita-Gotor 2006: τ_e = 6, τ_p = 1.5,
# f_l = 0.1) and SW absorption τ_sw = 0.22 σ² (O'Gorman & Schneider 2008), albedo 0.3.
# Moist physics as in Thatcher & Jablonowski (2016) plus simplified Betts–Miller convection
# (Frierson 2007). 20 m slab ocean, no ocean heat transport.
schema = 2
description = "Tidally locked aquaplanet (TRAPPIST-1e-like), gray radiation, T21 L26 (1 year)"
model = "primitive"
truncation = 21
levels = "L26"
dt = "20min"
length = "365day"
output_every = "15day"
output_fields = ["ts", "precip", "pw", "t850", "u850", "ps"]
initial_condition = { case = "jw06", perturbed = true }
station_every = "1h"
station_fields = ["precip", "ts", "t850", "u850"]

[[stations]]
name = "substellar"
lat = 0.0
lon = 180.0

[[stations]]
name = "terminator"
lat = 0.0
lon = 90.0

[[stations]]
name = "antistellar"
lat = 0.0
lon = 0.0

[star]
t_eff = 2566.0
luminosity = 0.000566
mass = 0.0898

# year and instellation: the original values, checked against the derived ones (< 1%).
[orbit]
semi_major_axis = 0.029254
eccentricity = 0.0
obliquity = 0.0
spin = "synchronous"
substellar_lon = 180.0
months = ["all"]
year = "6.1day"
instellation = 900.0

# rotation_rate: the original value, checked against 2π/year (< 1%).
[planet]
preset = "earth"
name = "tl-exo"
radius = 5860000.0
gravity = 9.12
rotation_rate = 1.1922e-05

# R_d and c_p: the Williamson et al. (1992) values used by the dynamical core, checked
# against the mixture (287.04 / 1005.0 J kg⁻¹ K⁻¹).
[atmosphere]
surface_pressure = 100000.0
composition = { N2 = 0.7808, O2 = 0.2095, Ar = 0.0093, CO2 = 0.0004 }
gas_constant = 287.04
cp = 1004.64

[moisture]
condensable = "water"
initial = "tj16"

[radiation]
scheme = "gray"

# Prototype: TJ16 bulk surface fluxes and boundary-layer mixing, HS Rayleigh drag (P1 replaces it).
[boundary_layer]
scheme = "tj16"

[convection]
scheme = "sbm"

[surface]
geography = "aquaplanet"

[surface.ocean]
model = "slab"
mixed_layer_depth = 20.0
initial = "tj16"

# Prototype ice-albedo switch: 0.6 below 271.15 K (ocean) / 273.15 K (land); P2 replaces it.
[surface.sea_ice]
enabled = true

[diffusion]
order = 4
tau = "2.4h"

[climatology]
start = "90day"
every = "6h"
maps = ["ts", "tas", "precip", "evap", "pw", "olr", "asr", "t850", "u850", "v850", "t500"]
