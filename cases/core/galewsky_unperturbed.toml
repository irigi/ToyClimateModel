# Galewsky, Scott & Polvani (2004), Tellus A 56, 429–440: barotropically unstable jet.
# u_max = 80 m/s, φ0 = π/7, φ1 = π/2 − φ0, mean depth 10 km (balanced h by quadrature),
# perturbation ĥ = 120 m, α = 1/3, β = 1/15, φ2 = π/4.
# The paper uses ∇² diffusion ν = 1e5 m² s⁻¹; we use the model's ∇⁸ hyperdiffusion.
# Checked 2026-11-15 against the paper (eqs. 2-4, p. 430-431) and its corrigendum (Tellus 58A,
# 520-522, 2006; only Figs. 2 and 6 changed): u_max = 80 m/s, φ0 = π/7, φ1 = π/2 − φ0,
# e_n = exp(−4/(φ1 − φ0)²), h0 such that the global mean depth is 10 km, ĥ = 120 m,
# α = 1/3, β = 1/15, φ2 = π/4, −π < λ < π; a = 6.37122e6 m, Ω = 7.292e-5 s⁻¹,
# g = 9.80616 m s⁻². All agree with the code. Compare day-6 vorticity with the
# corrigendum's Fig. 6 (diffusive case), not the original.
description = "Galewsky 2004 barotropic instability (unperturbed balanced jet)"
model = "shallow_water"
truncation = 85
dt = "8min"
length = "6day"
output_every = "1day"
output_fields = ["h", "vor", "u", "v"]
initial_condition = { case = "galewsky", perturbed = false }

[planet]
preset = "earth"

[diffusion]
order = 4
tau = "2.4h"
