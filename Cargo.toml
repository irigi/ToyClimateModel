[workspace]
resolver = "2"
members = ["crates/toyclim-core", "crates/toyclim-headless", "crates/toyclim-godot"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
toyclim-core = { path = "crates/toyclim-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
approx = "0.5"
realfft = "3.5"
rayon = "1"
criterion = { version = "0.5", default-features = false }

[profile.release]
debug = 1

[profile.test]
opt-level = 2
